<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isha's Space Party – Wheel of Names</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #050a1a;
      color: #e8eaf6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #stars-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Language toggle ── */
    .lang-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 50;
      display: flex;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 50px;
      padding: 3px;
      gap: 2px;
    }
    .lang-toggle button {
      padding: 5px 13px;
      border-radius: 50px;
      border: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      background: transparent;
      color: #94a3b8;
    }
    .lang-toggle button.active {
      background: #a78bfa;
      color: #050a1a;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 900;
      text-align: center;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff6ec7, #a78bfa, #60d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .birthday-heading {
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fbbf24;
      text-shadow: 0 0 12px rgba(251,191,36,0.5);
      text-align: center;
      margin-bottom: 8px;
    }

    .main-area {
      display: grid;
      grid-template-columns: min(280px, 92vw) auto min(280px, 92vw);
      gap: 28px;
      align-items: start;
      justify-content: center;
      margin-top: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (max-width: 900px) {
      .main-area { grid-template-columns: 1fr; }
    }

    /* ── Wheel ── */
    .wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .wheel-container {
      position: relative;
      width: min(420px, 92vw);
      height: min(420px, 92vw);
    }

    #wheel-canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: drop-shadow(0 0 24px rgba(167,139,250,0.5));
    }

    .pointer {
      position: absolute;
      right: -18px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 34px solid #ff6ec7;
      filter: drop-shadow(0 0 6px #ff6ec7);
    }

    #spin-btn {
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #a78bfa, #60d8ff);
      border: none;
      border-radius: 50px;
      color: #050a1a;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(167,139,250,0.5);
    }
    #spin-btn:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 6px 28px rgba(167,139,250,0.7);
    }
    #spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #restart-btn {
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(167,139,250,0.4);
      border-radius: 50px;
      color: #a78bfa;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    #restart-btn:hover { background: rgba(167,139,250,0.2); transform: scale(1.06); }

    .empty-note {
      color: #a78bfa;
      font-size: 0.9rem;
      text-align: center;
      font-style: italic;
    }

    /* ── Side panels ── */
    .panels {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(8px);
    }

    .panel h2 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 12px;
    }

    .name-input-row { display: flex; gap: 8px; }
    .name-input-row input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(167,139,250,0.4);
      background: rgba(255,255,255,0.07);
      color: #e8eaf6;
      font-size: 0.95rem;
      outline: none;
    }
    .name-input-row input:focus { border-color: #a78bfa; }
    .name-input-row button {
      padding: 9px 14px;
      border-radius: 10px;
      border: none;
      background: #a78bfa;
      color: #050a1a;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .name-input-row button:hover { background: #c4b5fd; }

    .name-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .name-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      font-size: 0.9rem;
      gap: 8px;
    }
    .name-list li .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .name-list li .name-text { flex: 1; }
    .name-list li button {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.7;
      padding: 0 2px;
      line-height: 1;
    }
    .name-list li button:hover { opacity: 1; }

    .picked-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 160px;
      overflow-y: auto;
    }
    .picked-list li {
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(96,216,255,0.08);
      font-size: 0.88rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .picked-list li::before { content: '🚀'; font-size: 0.8em; }
    .no-picks { color: #475569; font-size: 0.85rem; font-style: italic; }

    .planet-panel { align-self: start; }
    .planet-panel-heading { font-size: 1.1rem !important; letter-spacing: 2px; }

    .planet-ref-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .planet-ref-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
    }
    .planet-ref-list li .pr-emoji { font-size: 1.4rem; flex-shrink: 0; }
    .planet-ref-list li .pr-planet { font-size: 1rem; font-weight: 700; color: #c4b5fd; min-width: 62px; flex-shrink: 0; }
    .planet-ref-list li .pr-activity { font-size: 0.95rem; color: #94a3b8; }

    /* ── Winner modal ── */
    #winner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,10,26,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }
    #winner-modal.show { display: flex; }

    .modal-box {
      background: linear-gradient(145deg, #0f1a3a, #1a0933);
      border: 2px solid #a78bfa;
      border-radius: 24px;
      padding: 52px 60px;
      text-align: center;
      max-width: 500px;
      width: 94%;
      box-shadow: 0 0 60px rgba(167,139,250,0.4);
      animation: pop-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop-in {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .modal-box .trophy { font-size: 3.5rem; margin-bottom: 8px; }
    .modal-box h2 { font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; }
    .modal-box .winner-name {
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ff6ec7, #a78bfa, #60d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .modal-box p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }

    .modal-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .modal-buttons button {
      padding: 10px 24px;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .modal-buttons button:hover { transform: scale(1.05); }
    .btn-remove { background: linear-gradient(135deg, #ff6ec7, #a78bfa); color: #050a1a; }
    .btn-keep   { background: rgba(255,255,255,0.1); color: #e8eaf6; border: 1px solid rgba(255,255,255,0.2) !important; }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    /* ── Planet picker modal ── */
    #planet-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,10,26,0.9);
      z-index: 110;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    #planet-modal.show { display: flex; }

    .planet-modal-box {
      background: linear-gradient(145deg, #0f1a3a, #1a0933);
      border: 2px solid #fbbf24;
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 520px;
      width: 94%;
      box-shadow: 0 0 60px rgba(251,191,36,0.25);
      animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .planet-modal-box h2 {
      text-align: center;
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 20px;
    }
    .planet-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .planet-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px 8px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.15s, transform 0.15s, border-color 0.15s;
    }
    .planet-btn:hover { background: rgba(251,191,36,0.15); border-color: #fbbf24; transform: scale(1.05); }
    .planet-btn .p-emoji { font-size: 2.2rem; line-height: 1; }
    .planet-btn .p-name  { font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #e8eaf6; }

    /* ── Reveal modal ── */
    #reveal-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5,10,26,0.97);
      z-index: 120;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }
    #reveal-modal.show { display: flex; }

    .reveal-content {
      text-align: center;
      animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
      padding: 24px;
    }
    .reveal-planet-emoji { font-size: 7rem; line-height: 1; margin-bottom: 16px; display: block; }
    .reveal-planet-name {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fbbf24, #f97316, #ff6ec7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .reveal-activity {
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      font-weight: 700;
      color: #ffffff;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      padding: 14px 32px;
      margin-bottom: 36px;
      display: inline-block;
    }
    .reveal-tap-hint { font-size: 0.8rem; color: #475569; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<!-- Language toggle -->
<div class="lang-toggle">
  <button id="btn-lang-en" onclick="setLang('en')">EN</button>
  <button id="btn-lang-de" class="active" onclick="setLang('de')">DE</button>
</div>

<div class="page">
  <p class="birthday-heading" data-i18n="birthday"></p>
  <h1>⭐ Pin a Star ⭐</h1>

  <div class="main-area">
    <div class="panel planet-panel">
      <h2 class="planet-panel-heading">🪐 <span data-i18n="panelPlanets"></span></h2>
      <ul class="planet-ref-list" id="planet-ref-list"></ul>
    </div>

    <div class="wheel-wrap">
      <div class="wheel-container">
        <canvas id="wheel-canvas" width="420" height="420"></canvas>
        <div class="pointer"></div>
      </div>
      <button id="spin-btn" data-i18n="spin"></button>
      <button id="restart-btn" title="restart" data-i18n="restart">↺</button>
      <p class="empty-note" id="empty-note" style="display:none" data-i18n="emptyNote"></p>
    </div>

    <div class="panels">
      <div class="panel">
        <h2>👾 <span data-i18n="panelNames"></span></h2>
        <div class="name-input-row">
          <input type="text" id="name-input" data-i18n-placeholder="placeholder" maxlength="30" />
          <button id="add-btn" data-i18n-title="addTitle">+</button>
        </div>
        <br/>
        <ul class="name-list" id="name-list"></ul>
      </div>

      <div class="panel">
        <h2>🌟 <span data-i18n="panelPicked"></span></h2>
        <ul class="picked-list" id="picked-list">
          <li class="no-picks" id="no-picks-msg" data-i18n="noPicks"></li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div id="winner-modal">
  <div class="modal-box">
    <div class="trophy">🏆</div>
    <h2 id="modal-title" data-i18n="modalTitle"></h2>
    <div class="winner-name" id="winner-name-text"></div>
    <p id="modal-msg" data-i18n="modalQuestion"></p>
    <p id="modal-msg2" style="display:none; color:#a78bfa; font-style:italic; margin-top:-16px; margin-bottom:24px; font-size:0.88rem;"></p>
    <div class="modal-buttons">
      <button class="btn-remove" id="btn-remove" data-i18n="btnRemove"></button>
      <button class="btn-keep"   id="btn-keep"   data-i18n="btnKeep"></button>
    </div>
  </div>
</div>

<!-- Planet picker modal -->
<div id="planet-modal">
  <div class="planet-modal-box">
    <h2 data-i18n="pickPlanet"></h2>
    <div class="planet-grid" id="planet-grid"></div>
  </div>
</div>

<!-- Full-screen reveal modal -->
<div id="reveal-modal">
  <div class="reveal-content">
    <span class="reveal-planet-emoji" id="reveal-emoji"></span>
    <div class="reveal-planet-name" id="reveal-planet-name"></div>
    <div class="reveal-activity" id="reveal-activity"></div>
    <p class="reveal-tap-hint" data-i18n="tapToClose"></p>
  </div>
</div>

<script>
// ─── i18n ─────────────────────────────────────────────────────────────────────
const TRANSLATIONS = {
  en: {
    birthday:      "🎂 Isha's 9th Birthday 🎂",
    ishaTitle:     '⭐ The Birthday Star! ⭐',
    ishaMsg1:      'Happy Birthday, Chief Astronaut! 🚀 The galaxy is yours!',
    ishaMsg2:      'The Birthday Star gets to pin first! ⭐',
    spin:          'Spin!',
    emptyNote:     'Add names to spin the wheel',
    panelNames:    'Names on the wheel',
    placeholder:   'Add a name…',
    addTitle:      'Add name',
    panelPicked:   'Already picked',
    noPicks:       'No one picked yet',
    modalTitle:    'Astronaut selected!',
    modalQuestion: 'Remove from the wheel for the next spin?',
    btnRemove:     'Remove & continue',
    btnKeep:       'Keep on wheel',
    wheelEmpty:    'Add names!',
    restart:       'Restart',
    pinStarBtn:    '⭐ Pin the Star!',
    pickPlanet:    'Which planet was pinned?',
    tapToClose:    'Tap anywhere to close',
    panelPlanets:  'Planet Activities',
  },
  de: {
    birthday:      '🎂 Ishas 9. Geburtstag 🎂',
    ishaTitle:     '⭐ The Birthday Star! ⭐',
    ishaMsg1:      'Alles Gute zum Geburtstag, Chef-Astronautin! 🚀 Die Galaxie gehört dir!',
    ishaMsg2:      'Der Geburtstagsstar darf als Erstes pinnen! ⭐',
    spin:          'Drehen!',
    emptyNote:     'Namen hinzufügen, um das Rad zu drehen',
    panelNames:    'Namen auf dem Rad',
    placeholder:   'Name hinzufügen…',
    addTitle:      'Name hinzufügen',
    panelPicked:   'Bereits ausgewählt',
    noPicks:       'Noch niemand ausgewählt',
    modalTitle:    'Astronaut ausgewählt!',
    modalQuestion: 'Vom Rad entfernen für die nächste Runde?',
    btnRemove:     'Entfernen & weiter',
    btnKeep:       'Auf dem Rad behalten',
    wheelEmpty:    'Namen hinzufügen!',
    restart:       'Neu starten',
    pinStarBtn:    '⭐ Stern anpinnen!',
    pickPlanet:    'Welcher Planet wurde getroffen?',
    tapToClose:    'Tippen zum Schließen',
    panelPlanets:  'Planeten-Aktivitäten',
  },
};

let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  const t = TRANSLATIONS[lang];

  document.documentElement.lang = lang;
  document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-lang-de').classList.toggle('active', lang === 'de');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (t[key] !== undefined) el.placeholder = t[key];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.dataset.i18nTitle;
    if (t[key] !== undefined) el.title = t[key];
  });

  drawWheel();
  renderPlanetRef();
}

function t(key) {
  const val = TRANSLATIONS[currentLang][key];
  return val !== undefined ? val : key;
}

// ─── Palette ─────────────────────────────────────────────────────────────────
const COLORS = [
  '#6c2bd9','#2563eb','#0891b2','#059669','#d97706',
  '#dc2626','#7c3aed','#0284c7','#0d9488','#ca8a04',
  '#b45309','#9333ea','#1d4ed8','#065f46','#92400e',
];

// ─── State ───────────────────────────────────────────────────────────────────
let names   = [];
let picked  = [];
let spinning = false;
let currentAngle = 0;
let animId  = null;
let pendingWinner = null;
let firstSpin = true;

// ─── Stars background ─────────────────────────────────────────────────────────
(function initStars() {
  const c = document.getElementById('stars-canvas');
  const ctx = c.getContext('2d');
  let stars = [];

  function resize() {
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
    stars = Array.from({length: 180}, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.005,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    stars.forEach(s => {
      s.a = Math.max(0.1, Math.min(1, s.a + s.da));
      if (s.a <= 0.1 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', resize);
  draw();
})();

// ─── Wheel drawing ────────────────────────────────────────────────────────────
const wheelCanvas = document.getElementById('wheel-canvas');
const wctx = wheelCanvas.getContext('2d');
const SIZE = 420;
const CX = SIZE / 2, CY = SIZE / 2, R = SIZE / 2 - 4;

function drawWheel() {
  wctx.clearRect(0, 0, SIZE, SIZE);
  const n = names.length;

  if (n === 0) {
    wctx.beginPath();
    wctx.arc(CX, CY, R, 0, Math.PI * 2);
    wctx.fillStyle = '#1e1b4b';
    wctx.fill();
    wctx.strokeStyle = '#4c1d95';
    wctx.lineWidth = 4;
    wctx.stroke();
    wctx.fillStyle = '#6d28d9';
    wctx.font = 'bold 20px Segoe UI';
    wctx.textAlign = 'center';
    wctx.textBaseline = 'middle';
    wctx.fillText(t('wheelEmpty'), CX, CY);
    return;
  }

  const slice = (Math.PI * 2) / n;

  names.forEach((item, i) => {
    const start = currentAngle + i * slice;
    const end   = start + slice;

    wctx.beginPath();
    wctx.moveTo(CX, CY);
    wctx.arc(CX, CY, R, start, end);
    wctx.closePath();
    wctx.fillStyle = item.color;
    wctx.fill();
    wctx.strokeStyle = 'rgba(0,0,0,0.3)';
    wctx.lineWidth = 2;
    wctx.stroke();

    const mid   = start + slice / 2;
    const textR = R * 0.58;
    const tx = CX + Math.cos(mid) * textR;
    const ty = CY + Math.sin(mid) * textR;

    wctx.save();
    wctx.translate(tx, ty);
    // Radial text: flip left-half segments so text always reads outward
    const normMid = ((mid % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const flip = normMid > Math.PI / 2 && normMid < Math.PI * 3 / 2;
    wctx.rotate(flip ? mid + Math.PI : mid);

    const maxW  = R * 0.65;
    const fontSize = Math.min(15, Math.max(9, Math.floor(maxW / (item.name.length * 0.72))));
    wctx.font = `bold ${fontSize}px Segoe UI`;
    wctx.fillStyle = '#ffffff';
    wctx.textAlign = 'center';
    wctx.textBaseline = 'middle';
    wctx.shadowColor = 'rgba(0,0,0,0.7)';
    wctx.shadowBlur = 3;

    let label = item.name;
    while (wctx.measureText(label).width > maxW && label.length > 3) label = label.slice(0, -1);
    if (label !== item.name) label = label.slice(0, -1) + '…';

    wctx.fillText(label, 0, 0);
    wctx.restore();
  });

  wctx.beginPath();
  wctx.arc(CX, CY, 20, 0, Math.PI * 2);
  wctx.fillStyle = '#0f172a';
  wctx.fill();
  wctx.strokeStyle = '#a78bfa';
  wctx.lineWidth = 3;
  wctx.stroke();
}

// ─── Spin logic ───────────────────────────────────────────────────────────────
function getWinnerIndex() {
  const n = names.length;
  const slice = (Math.PI * 2) / n;
  let target = ((-currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  return Math.floor(target / slice) % n;
}

document.getElementById('spin-btn').addEventListener('click', spin);

function spin() {
  if (spinning || names.length === 0) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;

  const ishaIdx = firstSpin ? names.findIndex(n => n.name === 'Isha') : -1;
  firstSpin = false;

  let totalAngle;
  if (ishaIdx !== -1) {
    // Deterministically land on Isha: calculate the exact angle so the pointer
    // (at 0°) sits at the centre of Isha's segment after 7 full rotations.
    const slice = (Math.PI * 2) / names.length;
    const targetFinal = -(ishaIdx * slice + slice / 2);
    totalAngle = targetFinal - currentAngle + 7 * Math.PI * 2;
  } else {
    const extraSpins = 5 + Math.random() * 5;
    const extraAngle = Math.random() * Math.PI * 2;
    totalAngle = extraSpins * Math.PI * 2 + extraAngle;
  }

  const duration = 3500 + Math.random() * 1500;
  const startAngle = currentAngle;
  const startTime  = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + totalAngle * easeOut(progress);
    drawWheel();
    if (progress < 1) {
      animId = requestAnimationFrame(frame);
    } else {
      spinning = false;
      showWinner();
    }
  }
  animId = requestAnimationFrame(frame);
}

// ─── Winner ───────────────────────────────────────────────────────────────────
function showWinner() {
  const idx = getWinnerIndex();
  pendingWinner = idx;
  const isIsha = names[idx].name === 'Isha';

  document.getElementById('winner-name-text').textContent = names[idx].name;
  document.getElementById('modal-title').textContent = isIsha ? t('ishaTitle') : t('modalTitle');
  document.getElementById('modal-msg').textContent   = isIsha ? t('ishaMsg1')  : t('modalQuestion');
  const msg2 = document.getElementById('modal-msg2');
  msg2.textContent   = isIsha ? t('ishaMsg2') : '';
  msg2.style.display = isIsha ? 'block' : 'none';
  document.getElementById('winner-modal').classList.add('show');
  startConfetti();
}

document.getElementById('btn-remove').addEventListener('click', () => {
  if (pendingWinner === null) return;
  const removed = names.splice(pendingWinner, 1)[0];
  picked.push(removed.name);
  pendingWinner = null;
  closeModal();
  renderNameList();
  renderPickedList();
  snapToBoundary();
  document.getElementById('spin-btn').disabled = names.length === 0;
});

function snapToBoundary() {
  if (names.length === 0) { drawWheel(); return; }
  const slice = (Math.PI * 2) / names.length;
  // Where the pointer sits in the wheel's local frame
  const norm  = ((-currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  // Nearest boundary (multiple of slice)
  const nearestBoundary = Math.round(norm / slice) * slice;
  // Delta to apply to currentAngle (always within half a slice)
  const delta = norm - nearestBoundary;
  const startAngle  = currentAngle;
  const targetAngle = currentAngle + delta;
  const startTime   = performance.now();
  const duration    = 350;

  function frame(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    currentAngle = startAngle + delta * ease;
    drawWheel();
    if (progress < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

document.getElementById('btn-keep').addEventListener('click', () => {
  pendingWinner = null;
  closeModal();
  document.getElementById('spin-btn').disabled = false;
});

function closeModal() {
  document.getElementById('winner-modal').classList.remove('show');
  stopConfetti();
}

// ─── Name management ──────────────────────────────────────────────────────────
let colorIdx = 0;

function addName(name) {
  name = name.trim();
  if (!name) return;
  names.push({ name, color: COLORS[colorIdx % COLORS.length] });
  colorIdx++;
  renderNameList();
  drawWheel();
  updateSpinBtn();
}

function removeName(i) {
  names.splice(i, 1);
  renderNameList();
  drawWheel();
  updateSpinBtn();
}

function updateSpinBtn() {
  const btn  = document.getElementById('spin-btn');
  const note = document.getElementById('empty-note');
  btn.disabled = names.length === 0;
  note.style.display = names.length === 0 ? 'block' : 'none';
}

function renderNameList() {
  const ul = document.getElementById('name-list');
  ul.innerHTML = '';
  names.forEach((item, i) => {
    const li   = document.createElement('li');
    const dot  = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = item.color;
    const span = document.createElement('span');
    span.className = 'name-text';
    span.textContent = item.name;
    const btn  = document.createElement('button');
    btn.textContent = '×';
    btn.title = 'Remove';
    btn.addEventListener('click', () => removeName(i));
    li.append(dot, span, btn);
    ul.appendChild(li);
  });
}

function renderPickedList() {
  const ul = document.getElementById('picked-list');
  ul.innerHTML = '';
  if (picked.length === 0) {
    const li = document.createElement('li');
    li.id = 'no-picks-msg';
    li.className = 'no-picks';
    li.setAttribute('data-i18n', 'noPicks');
    li.textContent = t('noPicks');
    ul.appendChild(li);
    return;
  }
  picked.forEach(name => {
    const li = document.createElement('li');
    li.textContent = name;
    ul.appendChild(li);
  });
}

document.getElementById('add-btn').addEventListener('click', () => {
  const input = document.getElementById('name-input');
  addName(input.value);
  input.value = '';
  input.focus();
});
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('add-btn').click();
});

// ─── Confetti ─────────────────────────────────────────────────────────────────
const confCanvas = document.getElementById('confetti-canvas');
const cctx = confCanvas.getContext('2d');
let confParticles = [];
let confAnimId = null;
const CONF_COLORS = ['#ff6ec7','#a78bfa','#60d8ff','#fbbf24','#34d399','#f87171'];

function startConfetti() {
  confCanvas.width  = window.innerWidth;
  confCanvas.height = window.innerHeight;
  confParticles = Array.from({length: 120}, () => ({
    x: Math.random() * confCanvas.width,
    y: -10,
    vx: (Math.random() - 0.5) * 4,
    vy: 2 + Math.random() * 4,
    size: 6 + Math.random() * 8,
    color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)],
    rot: Math.random() * Math.PI * 2,
    drot: (Math.random() - 0.5) * 0.2,
  }));
  if (confAnimId) cancelAnimationFrame(confAnimId);
  drawConfetti();
}

function drawConfetti() {
  cctx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  let alive = false;
  confParticles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.07; p.rot += p.drot;
    if (p.y < confCanvas.height + 20) alive = true;
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    cctx.restore();
  });
  if (alive) confAnimId = requestAnimationFrame(drawConfetti);
}

function stopConfetti() {
  if (confAnimId) { cancelAnimationFrame(confAnimId); confAnimId = null; }
  cctx.clearRect(0, 0, confCanvas.width, confCanvas.height);
}

// ─── Restart ──────────────────────────────────────────────────────────────────
const DEFAULT_NAMES = [
  'Isha', 'Martha', 'Anna', 'Iram', 'Alina',
  'Elena', 'Nicolle', 'Valerie', 'Gamya', 'Aashrith',
  'Binie', 'Malik', 'Yojith', 'Ivaan',
];

function restart() {
  names    = [];
  picked   = [];
  colorIdx = 0;
  currentAngle = 0;
  pendingWinner = null;
  firstSpin = true;
  closeModal();
  DEFAULT_NAMES.forEach(n => addName(n));
  renderPickedList();
  drawWheel();
  updateSpinBtn();
}

document.getElementById('restart-btn').addEventListener('click', restart);

DEFAULT_NAMES.forEach(n => addName(n));
drawWheel();
updateSpinBtn();
